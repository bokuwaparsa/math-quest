# ─── Math Quest · GitHub Pages deployment ──────────────────────────────────
# Builds a fully static export of the game and publishes it to GitHub Pages.
# Live URL: https://bokuwaparsa.github.io/math-quest/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build:export

      - name: Collect export into out/
        run: |
          if [ -f out/index.html ]; then
            echo "Export already in out/"
          else
            mkdir -p out
            cp -r .next-static/. out/
          fi
          ls out | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
